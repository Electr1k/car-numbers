x-plate-worker: &plate-worker
  build:
    context: ./plate-service
    dockerfile: ../docker/plate-service/Dockerfile.dev
  volumes:
    - ./plate-service:/app
    - ./tmp:/app/tmp
  depends_on:
    plate-migrate:
      condition: service_completed_successfully
  env_file: ./plate-service/.env
  restart: always

services:
  plate-api:
    build:
      context: ./plate-service
      dockerfile: ../docker/plate-service/Dockerfile.dev
    ports:
      - "${PLATE_HTTP_FORWARD_PORT:-8080}:8080"
    volumes:
      - ./plate-service:/app
      - ./tmp:/app/tmp
    depends_on:
      plate-migrate:
        condition: service_completed_successfully
    env_file: ./plate-service/.env
    restart: always
    networks:
      - default
      - shared-network

  core-api:
    build:
      context: ./core-service
      dockerfile: ../docker/core-service/Dockerfile.dev
    ports:
      - "${CORE_HTTP_FORWARD_PORT:-8081}:8080"
    volumes:
      - ./core-service:/app
    depends_on:
      - db
    env_file: ./core-service/.env
    restart: always
    networks:
      - default
      - shared-network

  ml-api:
    build:
      context: ./ML
      dockerfile: ../docker/ml/Dockerfile.dev
    volumes:
      - ./ml-service:/app
      - ./ml-service/models:/app/models
      - ./ml-service/data:/app/data:ro
    ports:
      - "8000:8000"
    restart: always
    networks:
      - shared-network

  frontend:
    build:
      context: ./frontend/web
    ports:
      - "80:3000"
    volumes:
      - ./frontend/web:/app
      - /app/node_modules
      - /app/.nuxt
    environment:
      - CORE_URL=http://core-api:8080
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
    restart: unless-stopped
    networks:
      - default
      - shared-network

  db:
    image: postgres:15-alpine
    ports:
      - "${DB_FORWARD_PORT:-8989}:5432"
    env_file: ./docker/db/.env
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  plate-worker-autonomera:
    <<: *plate-worker
    command: ["air", "-c", ".air.worker.toml",
              "-build.bin", "./tmp/worker-autonomera",
              "-build.cmd", "go build -o ./tmp/worker-autonomera ./cmd/worker",
              "-build.log", "build-errors-worker-autonomera.log"]
    environment:
      WORKER_QUEUES: autonomera
      WORKER_CONCURRENCY: ${AUTONOMERA_WORKER_CONCURRENCY:-5}

  plate-worker-gosnomeru:
    <<: *plate-worker
    command: ["air", "-c", ".air.worker.toml",
              "-build.bin", "./tmp/worker-gosnomeru",
              "-build.cmd", "go build -o ./tmp/worker-gosnomeru ./cmd/worker",
              "-build.log", "build-errors-worker-gosnomeru.log"]
    environment:
      WORKER_QUEUES: gosnomeru
      WORKER_CONCURRENCY: ${GOSNOMERU_WORKER_CONCURRENCY:-8}

  plate-worker-anomera:
    <<: *plate-worker
    command: ["air", "-c", ".air.worker.toml",
              "-build.bin", "./tmp/worker-anomera",
              "-build.cmd", "go build -o ./tmp/worker-anomera ./cmd/worker",
              "-build.log", "build-errors-worker-anomera.log"]
    environment:
      WORKER_QUEUES: anomera
      WORKER_CONCURRENCY: ${ANOMERA_WORKER_CONCURRENCY:-5}

  plate-worker-default:
    <<: *plate-worker
    command: ["air", "-c", ".air.worker.toml",
              "-build.bin", "./tmp/worker-default",
              "-build.cmd", "go build -o ./tmp/worker-default ./cmd/worker",
              "-build.log", "build-errors-worker-default.log"]
    environment:
      WORKER_QUEUES: default
      WORKER_CONCURRENCY: ${DEFAULT_WORKER_CONCURRENCY:-1}

  plate-migrate:
    build:
      context: ./plate-service
      dockerfile: ../docker/plate-service/Dockerfile.dev
    volumes:
      - ./plate-service:/app
    command: ["go", "run", "./cmd/migrate"]
    depends_on:
      - db
    env_file: ./plate-service/.env
    restart: on-failure

networks:
  shared-network:
    external: true
    name: shared-network