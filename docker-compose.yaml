x-plate-worker: &plate-worker
  build:
    context: ./plate-service
    dockerfile: ../docker/plate-service/Dockerfile.dev
  volumes:
    - ./plate-service:/app
    - ./tmp:/app/tmp
  depends_on:
    plate-migrate:
      condition: service_completed_successfully
  env_file: .env
  restart: always

services:
  plate-migrate:
    build:
      context: ./plate-service
      dockerfile: ../docker/plate-service/Dockerfile.dev
    volumes:
      - ./plate-service:/app
    command: ["go", "run", "./cmd/migrate"]
    depends_on:
      - plate-db
    env_file: .env
    restart: on-failure

  plate-api:
    build:
      context: ./plate-service
      dockerfile: ../docker/plate-service/Dockerfile.dev
    ports:
      - "${HTTP_FORWARD_PORT:-8080}:${HTTP_PORT:-8080}"
    volumes:
      - ./plate-service:/app
      - ./tmp:/app/tmp
    depends_on:
      plate-migrate:
        condition: service_completed_successfully
    env_file: .env
    restart: always
    networks:
      - default
      - shared-network

  plate-worker-autonomera:
    <<: *plate-worker
    command: ["air", "-c", ".air.worker.toml",
              "-build.bin", "./tmp/worker-autonomera",
              "-build.cmd", "go build -o ./tmp/worker-autonomera ./cmd/worker",
              "-build.log", "build-errors-worker-autonomera.log"]
    environment:
      WORKER_QUEUES: autonomera
      WORKER_CONCURRENCY: ${AUTONOMERA_WORKER_CONCURRENCY:-5}

  plate-worker-gosnomeru:
    <<: *plate-worker
    command: ["air", "-c", ".air.worker.toml",
              "-build.bin", "./tmp/worker-gosnomeru",
              "-build.cmd", "go build -o ./tmp/worker-gosnomeru ./cmd/worker",
              "-build.log", "build-errors-worker-gosnomeru.log"]
    environment:
      WORKER_QUEUES: gosnomeru
      WORKER_CONCURRENCY: ${GOSNOMERU_WORKER_CONCURRENCY:-8}

  plate-worker-anomera:
    <<: *plate-worker
    command: ["air", "-c", ".air.worker.toml",
              "-build.bin", "./tmp/worker-anomera",
              "-build.cmd", "go build -o ./tmp/worker-anomera ./cmd/worker",
              "-build.log", "build-errors-worker-anomera.log"]
    environment:
      WORKER_QUEUES: anomera
      WORKER_CONCURRENCY: ${ANOMERA_WORKER_CONCURRENCY:-5}

  plate-worker-default:
    <<: *plate-worker
    command: ["air", "-c", ".air.worker.toml",
              "-build.bin", "./tmp/worker-default",
              "-build.cmd", "go build -o ./tmp/worker-default ./cmd/worker",
              "-build.log", "build-errors-worker-default.log"]
    environment:
      WORKER_QUEUES: default
      WORKER_CONCURRENCY: ${DEFAULT_WORKER_CONCURRENCY:-1}

  ml-api:
    build:
      context: ./ML
      dockerfile: ../docker/ml/Dockerfile.dev
    volumes:
      - ./ML:/app
      - ./ML/models:/app/models
      - ./ML/data:/app/data:ro
    ports:
      - "8000:8000"
    restart: always
    networks:
      - shared-network

  frontend:
    build:
      context: ./frontend/web
    ports:
      - "3000:3000"
    volumes:
      # исходники монтируются для горячей перезагрузки
      - ./frontend/web:/app
      # node_modules остаются контейнерными, чтобы хостовые не затирали их
      - /app/node_modules
      - /app/.nuxt
    environment:
      - CORE_URL=http://core-api:8080
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3000
    restart: unless-stopped
    networks:
      - default
      - shared-network

  plate-db:
    image: postgres:15-alpine
    ports:
      - ${DATABASE_PORT:-5555}:5432
    environment:
      - POSTGRES_USER=${DATABASE_USER:-postgres}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-postgres1}
      - POSTGRES_DB=${DATABASE_DATABASE:-postgres}
    volumes:
      - ./pgdata:/var/lib/postgresql/data

networks:
  shared-network:
    external: true
    name: shared-network