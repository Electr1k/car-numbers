name: monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./docker/monitoring/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    restart: always
    logging: *logging

  alloy:
    image: grafana/alloy:v1.10.2
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./docker/monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: always
    logging: *logging

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./docker/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: always
    logging: *logging

volumes:
  loki-data:
  alloy-data:
  grafana-data:
